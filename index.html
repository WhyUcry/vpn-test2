<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>Скапиздончик vpn</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: radial-gradient(1200px 600px at 50% -10%, #1b2433, #0f1115 60%);
    color: #e8ecf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .logo { font-size: 56px; line-height: 1; margin-bottom: 12px; }
  h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: .2px; }
  p { margin: 0 0 20px; color: #9aa6b8; font-size: 15px; line-height: 1.5; }
  .btn {
    display: block; width: 100%; padding: 16px 20px; margin-bottom: 12px;
    border-radius: 14px; border: 0; font-size: 17px; font-weight: 600; cursor: pointer;
    background: linear-gradient(180deg, #4f8cff, #2f6ae0); color: #fff; text-decoration: none;
    box-shadow: 0 8px 24px rgba(47, 106, 224, .35);
  }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: transparent; color: #cfd8e6; border: 1px solid #2b3446; box-shadow: none;
    font-weight: 500; font-size: 15px; padding: 13px 20px;
  }
  .hint { font-size: 13px; color: #7c8798; margin: 18px 0 0; }
  code { font-size: 12px; color: #8fa4c4; word-break: break-all; }
</style>
</head>
<body>
<main>
  <div class="logo">🛡️</div>
  <h1>Скапиздончик vpn</h1>
  <p id="status">Нажмите кнопку — подписка добавится в Happ автоматически.</p>
  <a class="btn" id="add" href="#">Добавить в Happ</a>
  <button class="btn ghost" id="copy" type="button">Скопировать ссылку</button>
  <p class="hint">Если Happ не открылся — установите его и нажмите кнопку снова.<br>
  <code id="url"></code></p>
</main><script>
(function () {
  // Happ принимает прямую ссылку вида happ://add/<URL подписки> (без base64)
  var SUB_PATH = 'output/sub.txt';

  // Счётчик устройств. GitHub Pages не отдаёт статистику запросов,
  // поэтому считаем сами: каждое устройство при добавлении подписки
  // один раз увеличивает счётчик (флаг хранится в localStorage).
  var COUNTER_API = 'https://abacus.jasoncameron.dev';
  var COUNTER_NS = 'whyucry-vpn-test2';
  var COUNTER_KEY = 'installs';
  var DEVICE_KEY = 'skapidzonchik-sub-added';

  var base = new URL(SUB_PATH, location.href).href;
  var deep = 'happ://add/' + base;

  var addBtn = document.getElementById('add');
  var copyBtn = document.getElementById('copy');
  var status = document.getElementById('status');
  var urlEl = document.getElementById('url');

  addBtn.href = deep;
  urlEl.textContent = base;

  function counterUrl(action) {
    return COUNTER_API + '/' + action + '/' + COUNTER_NS + '/' + COUNTER_KEY;
  }

  // Прочитать текущее количество устройств (без изменения счётчика)
  function readCount() {
    return fetch(counterUrl('get'))
      .then(function (r) { return r.json(); })
      .then(function (d) { return d.value; });
  }

  // Увеличить счётчик и вернуть новое значение
  function hitCount() {
    return fetch(counterUrl('hit'))
      .then(function (r) { return r.json(); })
      .then(function (d) { return d.value; });
  }

  function logCount() {
    readCount().then(function (n) {
      console.log('Устройств с подпиской «Скапиздончик vpn»: ' + n);
    }).catch(function (e) {
      console.warn('Не удалось получить количество устройств:', e);
    });
  }

  // Учитываем устройство только один раз (force = true — учесть принудительно)
  function registerDevice(force) {
    var known = false;
    try { known = localStorage.getItem(DEVICE_KEY) === '1'; } catch (e) {}
    if (known && force !== true) { logCount(); return Promise.resolve(); }

    return hitCount().then(function (n) {
      try { localStorage.setItem(DEVICE_KEY, '1'); } catch (e) {}
      console.log('Устройство учтено. Всего устройств с подпиской «Скапиздончик vpn»: ' + n);
      return n;
    }).catch(function (e) {
      console.warn('Не удалось обновить счётчик устройств:', e);
      return null;
    });
  }

  // --- API для браузерной консоли (DevTools) ---
  // vpnSub.count()    — показать количество устройств
  // vpnSub.register() — учесть это устройство принудительно
  // vpnSub.forget()   — забыть это устройство (учтётся заново)
  // vpnSub.help()     — список команд
  var vpnSub = {
    count: function () {
      return readCount().then(function (n) {
        console.log('Устройств с подпиской «Скапиздончик vpn»: ' + n);
        return n;
      }).catch(function (e) {
        console.warn('Не удалось получить количество устройств:', e);
        return null;
      });
    },
    register: function () {
      return registerDevice(true);
    },
    forget: function () {
      try { localStorage.removeItem(DEVICE_KEY); } catch (e) {}
      console.log('Это устройство забыто: при следующем добавлении подписки оно учтётся снова.');
    },
    help: function () {
      console.log(
        '%cПодписка «Скапиздончик vpn» — команды в консоли',
        'font-weight:bold'
      );
      console.table([
        { команда: 'vpnSub.count()', описание: 'Показать количество устройств с подпиской' },
        { команда: 'vpnSub.register()', описание: 'Учесть это устройство принудительно' },
        { команда: 'vpnSub.forget()', описание: 'Забыть это устройство' },
        { команда: 'vpnSub.help()', описание: 'Показать эту справку' },
      ]);
      console.log('Прямой адрес счётчика: ' + counterUrl('get'));
      return 'Готово';
    },
    url: base,
    deepLink: deep,
  };
  window.vpnSub = vpnSub;

  logCount();
  console.log('Консоль: vpnSub.count() — количество устройств, vpnSub.help() — все команды.');

  addBtn.addEventListener('click', function () { registerDevice(false); });

  copyBtn.addEventListener('click', function () {
    var done = function () {
      copyBtn.textContent = 'Ссылка скопирована';
      setTimeout(function () { copyBtn.textContent = 'Скопировать ссылку'; }, 1800);
    };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = base;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { status.textContent = base; }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(base).then(done, fallback);
    } else {
      fallback();
    }
  });

  // На телефоне сразу открываем Happ
  if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) {
    status.textContent = 'Открываем Happ…';
    registerDevice(false);
    setTimeout(function () { location.href = deep; }, 700);
  }
})();
</script>
</body>
</html>
