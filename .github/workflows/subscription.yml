name: Subscription

on:
  push:
    branches: [main]
    paths:
      - "configs/**"
      - "generate_subscription.py"
      - "index.html"
      - "favicon.svg"
      - ".github/workflows/subscription.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # setup-python не используем: на ubuntu-latest Python 3 уже есть в образе,
      # а скрипт берёт только стандартную библиотеку. Это снимает ошибку
      # «Unable to resolve action actions/setup-python@v5» в редакторе.
      - name: Generate subscription
        run: python3 generate_subscription.py

      - name: Commit updated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "Подписка не изменилась"
          else
            git commit -m "chore: обновление подписки [skip ci]"
            git push origin HEAD:main
          fi

      - name: Prepare Pages site
        run: |
          mkdir -p site/output
          cp output/sub.txt site/sub.txt
          cp output/subscription.txt site/subscription.txt
          cp output/sub.json site/sub.json
          cp output/sub.txt site/output/sub.txt
          cp output/subscription.txt site/output/subscription.txt
          cp output/sub.json site/output/sub.json
          cp index.html site/index.html
          cp favicon.svg site/favicon.svg
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages может быть ещё не включён (Settings -> Pages -> Source: GitHub Actions).
      # Тогда просто пропускаем деплой, подписка всё равно доступна по raw-ссылке.
      - name: Check whether Pages is enabled
        id: pages
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages не включён. Settings -> Pages -> Source: GitHub Actions. Подписка доступна по raw-ссылке."
          fi

      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
