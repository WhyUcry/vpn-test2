name: Subscription

on:
  push:
    branches: [main]
    paths:
      - "configs/**"
      - "generate_subscription.py"
      - ".github/workflows/subscription.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate subscription
        run: python generate_subscription.py

      - name: Commit updated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "Подписка не изменилась"
          else
            git commit -m "chore: обновление подписки [skip ci]"
            git push origin HEAD:main
          fi

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp output/sub.txt site/sub.txt
          cp output/subscription.txt site/subscription.txt
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
