<?xml version="1.0" encoding="UTF-8"?>
<!-- Морда рыжего котёнка — иконка сайта (та же стилистика, что и на index.html) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffce8a"/>
      <stop offset="1" stop-color="#f59b4b"/>
    </linearGradient>
    <linearGradient id="e" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc2cf"/>
      <stop offset="1" stop-color="#ff9db0"/>
    </linearGradient>
  </defs>

  <!-- тёплый круг под котиком -->
  <circle cx="32" cy="32" r="32" fill="#ffe1bd"/>

  <!-- уши -->
  <path d="M14 26 L11 6 L28 16 Z" fill="url(#f)" stroke="#e07b39" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M50 26 L53 6 L36 16 Z" fill="url(#f)" stroke="#e07b39" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M17.5 22 L16 13 L24 17.5 Z" fill="url(#e)"/>
  <path d="M46.5 22 L48 13 L40 17.5 Z" fill="url(#e)"/>

  <!-- голова -->
  <ellipse cx="32" cy="37" rx="22" ry="19" fill="url(#f)" stroke="#e07b39" stroke-width="2.4"/>

  <!-- полоски на лбу -->
  <path d="M32 20 q2.5 3 0 6" stroke="#e07b39" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".55"/>
  <path d="M24.5 22 q2 3 .5 5.5" stroke="#e07b39" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".45"/>
  <path d="M39.5 22 q-2 3 -.5 5.5" stroke="#e07b39" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".45"/>

  <!-- глаза -->
  <ellipse cx="24.5" cy="36" rx="3.4" ry="4" fill="#4a2c17"/>
  <ellipse cx="39.5" cy="36" rx="3.4" ry="4" fill="#4a2c17"/>
  <circle cx="25.7" cy="34.7" r="1.3" fill="#fff"/>
  <circle cx="40.7" cy="34.7" r="1.3" fill="#fff"/>

  <!-- щёчки -->
  <ellipse cx="18" cy="43" rx="3.8" ry="2.5" fill="#ff9db0" opacity=".5"/>
  <ellipse cx="46" cy="43" rx="3.8" ry="2.5" fill="#ff9db0" opacity=".5"/>

  <!-- нос и рот -->
  <path d="M30 41.5 h4 l-2 2.2 z" fill="#ff8fa3"/>
  <path d="M32 43.7 v1.6 M32 45.3 q-3 2.6 -5.6 0 M32 45.3 q3 2.6 5.6 0"
        stroke="#4a2c17" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- усы -->
  <path d="M10 41 h5 M10 45 h5 M54 41 h-5 M54 45 h-5"
        stroke="#e07b39" stroke-width="1.3" stroke-linecap="round" opacity=".6"/>
</svg>
